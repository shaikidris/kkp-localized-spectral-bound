  reviewers: []
fidelity:
  divergences: >-
    The theorem applies to all finite noncomplete graphs with at least two
    vertices and hence includes KKP's connected convention. A linear order
    enumerates each unordered edge once. No claim about Conjectures 1.16 or 1.17
    is selected in this package.
