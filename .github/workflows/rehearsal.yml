name: Palomar rehearsal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    name: Pinned Palomar preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PalomarRegistry/PalomarSubmission
          ref: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
          path: pipeline
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.10'
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: '3.3.12'
          bundler-cache: true
          working-directory: pipeline
      - name: Install pinned verifier dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r pipeline/requirements.txt
      - name: Prepare the exact source snapshot
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/pipeline/Gemfile
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, pathlib, uuid
          inputs = {
              'repository': os.environ['SOURCE_REPOSITORY'],
              'commit': os.environ['SOURCE_COMMIT'],
              'request_id': uuid.uuid4().hex[:12],
              'mode': 'preflight',
              'options': json.dumps({
                  'authorization_relationship': 'I am a responsible author or maintainer',
                  'comparator_config_path': 'comparator.json',
                  'formalization_metadata_path': 'formalization.yaml',
              }),
          }
          pathlib.Path(os.environ['RUNNER_TEMP'], 'inputs.json').write_text(json.dumps({'inputs': inputs}))
          PY
          python pipeline/scripts/verify_submission.py prepare \
            --event "$RUNNER_TEMP/inputs.json" --work-dir "$RUNNER_TEMP/palomar" \
            --output "$RUNNER_TEMP/preflight-report.json" --licensee "$(command -v bundle)"
          python - <<'PY'
          import json, os, pathlib
          report = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'preflight-report.json').read_text())
          assert report['status'] == 'pass', report
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: preflight-report
          path: ${{ runner.temp }}/preflight-report.json
  comparator:
    name: Linux build and bundled kernels
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PalomarRegistry/PalomarSubmission
          ref: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
          path: pipeline
          persist-credentials: false
      - name: Install pinned elan and bubblewrap
        run: |
          python3 pipeline/scripts/trusted_download.py \
            --url https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/elan.tar.gz" \
            --sha256 df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          mkdir "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq meson ninja-build libcap-dev pkg-config
          pipeline/scripts/install_bwrap.sh "$RUNNER_TEMP/bwrap-bin"
          echo "$RUNNER_TEMP/bwrap-bin" >> "$GITHUB_PATH"
      - name: Build and audit the snapshot
        run: |
          mkdir -p rehearsal-evidence
          lake exe cache get
          lake build Challenge Solution SubmissionAudit 2>&1 | tee rehearsal-evidence/build.log
      - name: Run sandboxed Comparator with independent kernels
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          prefix = subprocess.check_output(['lean', '--print-prefix'], text=True).strip()
          config = json.loads(pathlib.Path('comparator.json').read_text())
          config['external_kernels'] = {
              'nanoda': [prefix + '/bin/nanoda_bin'],
              'con-ron': [prefix + '/bin/con-ron', '--jobs=2'],
          }
          pathlib.Path('rehearsal-evidence/comparator.json').write_text(json.dumps(config, indent=2) + '\n')
          PY
          lake comparator --config rehearsal-evidence/comparator.json 2>&1 | tee rehearsal-evidence/comparator.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: linux-comparator-evidence
          path: rehearsal-evidence/
